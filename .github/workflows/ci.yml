name: ci

on:
  push:
    branches: [main, reference]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # reference holds solutions, so the starter-state contract only applies elsewhere
    if: github.ref != 'refs/heads/reference'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync practice project
        working-directory: practice
        run: uv sync
      - name: Practice tests
        working-directory: practice
        run: uv run pytest tests
      - name: Ruff lint
        working-directory: practice
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: practice
        run: uv run ruff format --check .
      - name: Tools tests
        run: uv run --with pytest pytest tools/tests -q
      - name: Guide checker
        run: uv run --with pytest python tools/check_guide.py .
      - name: Starter-state contract (every session checkpoint must fail on main)
        working-directory: practice
        run: |
          # Each checkpoint must fail for the expected reason (not a crash or typo),
          # otherwise a solution has leaked into main.
          fail=0
          for n in 1 2 3 4 5; do
            f="checkpoints/test_session_${n}.py"
            if [ "$n" = 3 ]; then
              pattern='AssertionError|FAILED'   # S3 fails by assertion, not import
            else
              pattern='ImportError|ModuleNotFoundError|cannot import name'
            fi
            set +e
            out=$(uv run pytest "$f" 2>&1)
            rc=$?
            set -e
            echo "::group::$f (exit $rc)"
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -ne 1 ] && [ "$rc" -ne 2 ]; then
              echo "::error::$f exited $rc; expected 1 or 2 (0 means a solution leaked into main, other codes mean a crash or bad path)"
              fail=1
            elif ! echo "$out" | grep -Eq "$pattern"; then
              echo "::error::$f failed, but not for the expected reason ($pattern)"
              fail=1
            else
              echo "OK: $f fails as expected (starter state intact)."
            fi
          done
          exit "$fail"

  reference:
    # Runs MAIN's checkpoints and tests against the reference solution: check out
    # main, then overlay only the solved code (practice/src, practice/pyproject.toml)
    # from the reference branch. Runs on pushes to main and to reference, so either
    # side changing out of step fails here.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Overlay the reference solution
        run: |
          git fetch origin reference
          git checkout FETCH_HEAD -- practice/src practice/pyproject.toml
          git status --short
      - uses: astral-sh/setup-uv@v6
      - name: Sync practice project
        working-directory: practice
        run: uv sync
      - name: Checkpoints and tests on main, solution from reference
        working-directory: practice
        run: uv run pytest checkpoints tests
      - name: Ruff on the reference solution
        working-directory: practice
        run: |
          uv run ruff check src
          uv run ruff format --check src

  setup-smoke:
    # Depends on claude.ai serving install.sh to GitHub runners, so it runs only
    # on pushes to main (and by hand), not on every pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Install Claude Code (Linux native installer)
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Verify install
        run: |
          "$HOME/.local/bin/claude" --version
