name: pages

# Builds the single-page HTML guide (site/build_guide.py) and publishes it to
# GitHub Pages whenever the guide changes on main.
on:
  push:
    branches: [main]
    paths: ["README.md", "guide/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the HTML guide
        run: |
          mkdir -p _site
          uv run --no-project --with markdown-it-py python site/build_guide.py _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
